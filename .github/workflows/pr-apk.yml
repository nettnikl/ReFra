name: PR APK

# Small installable APK per PR: Arm64-v8a · NoML · Release (debug-signed)
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true

      - name: Fix permissions
        run: chmod +x ./gradlew

      - name: Tune Gradle for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

      # No release keystore → app/build.gradle.kts signs with the debug key
      # (fine for sideload testing; Nightly stays release-signed).
      - name: Build native libs
        uses: ./.github/actions/build-native-libs
        with:
          arch: Arm64-v8a

      - name: Build Arm64-v8a NoML Release APK
        run: ./gradlew --build-cache :app:assembleArm64-v8aNoMLRelease

      - name: Rename APK for download
        run: |
          set -euo pipefail
          mkdir -p out
          pr="${{ github.event.pull_request.number }}"
          label="${pr:+pr-${pr}-}${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          label="$(echo "$label" | tr '/:' '--')"
          src="$(find app/build/outputs/apk-renamed -name '*.apk' -type f | head -n 1)"
          test -n "$src"
          cp "$src" "out/ReFra-${label}-arm64-v8a-noml.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v5
        with:
          name: ReFra-pr-${{ github.event.pull_request.number || 'manual' }}-arm64-v8a-noml
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error
